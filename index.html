<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flowers For You?</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
#background{position:fixed;inset:0;background:#ffb9c4;transition:opacity 1.2s ease,visibility 1.2s}
#background.fade-out{opacity:0;visibility:hidden}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.pic{width:180px;height:163px;background:#fff;border-radius:4px;margin:0 auto 14px;overflow:hidden}
.pic img{width:100%;height:100%;display:block}
h1{font-size:22px;margin:0 0 12px;color:#111}
.btns{display:flex;gap:10px;justify-content:center;align-items:center}
button{font:700 14px inherit;font-family:inherit;color:#fff;border:0;border-radius:4px;padding:7px 18px;cursor:pointer}
#yesBtn{background:#12a33a}
#noBtn{background:#f02a2a}
#noBtn.moved{position:fixed;transition:left .25s,top .25s}
#flowerContainer{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity 1.4s ease .6s;background:#000}
#flowerContainer.visible{opacity:1;visibility:visible}
#sunCanvas{height:min(62vh,500px);max-width:92vw;aspect-ratio:410/420}
#pickup{min-height:3.4em;margin:0;padding:0 22px;max-width:520px;text-align:center;color:#ffe27a;
  font-size:clamp(16px,4.4vw,22px);line-height:1.6;opacity:0;transition:opacity 1s ease}
#pickup.show{opacity:1}
/* พื้นหลังดอกไม้ */
#bgFlowers,#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.card,#sunCanvas,#pickup{position:relative;z-index:1}
.card{position:absolute}
.bgf{position:absolute;opacity:.8;animation:floaty var(--d) ease-in-out var(--delay) infinite alternate}
@keyframes floaty{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(-16px) rotate(calc(var(--r0) + 25deg))}}
#flowerContainer{background:radial-gradient(circle at 50% 42%,#3b2a06 0%,#120d02 45%,#000 75%)}
.petal{position:absolute;top:-6%;left:var(--x);width:var(--w);height:calc(var(--w) * 1.3);
  border-radius:50% 0 50% 50%;background:linear-gradient(135deg,#ffe27a,#f0a812);opacity:0;
  animation:fall var(--t) linear var(--delay) infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}
  100%{transform:translate(var(--sway),112vh) rotate(540deg);opacity:.85}}
/* แมวส้มแลบลิ้น */
#cat{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:0;width:min(36vw,170px);
  transform:translateY(105%);transition:transform .8s cubic-bezier(.3,1.6,.5,1);z-index:2;pointer-events:none}
#cat.show{transform:none}
#cat svg{display:block;width:100%;height:auto}
.bubble{position:absolute;right:6%;bottom:96%;background:#fff;color:#222;font-weight:700;
  font-size:clamp(14px,3.6vw,18px);padding:7px 14px;border-radius:16px;white-space:nowrap;
  opacity:0;transform:scale(.6);transform-origin:80% 100%;transition:opacity .4s ease .7s,transform .5s cubic-bezier(.3,1.6,.5,1) .7s}
.bubble::after{content:"";position:absolute;right:26px;top:100%;border:8px solid transparent;border-top-color:#fff}
#cat.show .bubble{opacity:1;transform:none}
.tongue{transform-origin:100px 122px;animation:blep .8s ease-in-out infinite alternate}
@keyframes blep{from{transform:scaleY(.82)}to{transform:scaleY(1.12)}}
.catbob{animation:bob 2.4s ease-in-out infinite alternate;transform-origin:100px 200px}
@keyframes bob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
</style>
</head>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const content = document.getElementById("content");
const background = document.getElementById("background");
const flowerContainer = document.getElementById("flowerContainer");

if (noBtn && content) {
  const moveNoBtn = () => {
    noBtn.classList.add("moved");
    const left = 8 + Math.random() * 78;
    const top = 8 + Math.random() * 82;
    noBtn.style.left = `${left}%`;
    noBtn.style.top = `${top}%`;
  };
  noBtn.addEventListener("mouseenter", moveNoBtn);
  noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoBtn(); }, { passive: false });
  noBtn.addEventListener("click", (event) => { event.preventDefault(); moveNoBtn(); });
  window.addEventListener("resize", () => {
    noBtn.classList.remove("moved"); noBtn.style.left = noBtn.style.top = "";
  });
}

// ---- Sunflower: regions (colour + contours), painted dark -> light like the turtle clip ----
// ---- พื้นหลังดอกไม้: หน้าชมพู = ดอกไม้ลอยเบาๆ / หน้าดำ = กลีบทานตะวันโปรยลง ----
(function buildBackgrounds() {
  const rand = (a, b) => a + Math.random() * (b - a);
  const colors = ["#ffffff", "#ff8fa8", "#ffd1dc", "#ffe27a", "#ff6f91", "#f9f0ff"];
  const flowerSVG = (c) => {
    let petals = "";
    for (let k = 0; k < 6; k++)
      petals += `<ellipse cx="0" cy="-24" rx="14" ry="25" fill="${c}" transform="rotate(${k * 60})"/>`;
    return `<svg viewBox="-52 -52 104 104" width="100%" height="100%">${petals}<circle r="12" fill="#ffb300"/></svg>`;
  };
  const bg = document.getElementById("bgFlowers");
  for (let n = 0; n < 26; n++) {
    let x, y;
    do { x = rand(0, 100); y = rand(0, 100); }
    while (Math.abs(x - 50) < 24 && Math.abs(y - 50) < 32);     // เว้นกลางจอไว้ให้การ์ดอ่านง่าย
    const el = document.createElement("div");
    const size = rand(26, 70);
    el.className = "bgf";
    el.innerHTML = flowerSVG(colors[Math.floor(rand(0, colors.length))]);
    Object.assign(el.style, { left: x + "%", top: y + "%", width: size + "px", height: size + "px" });
    el.style.setProperty("--d", rand(4, 8) + "s");
    el.style.setProperty("--delay", -rand(0, 6) + "s");
    el.style.setProperty("--r0", rand(0, 360) + "deg");
    bg.appendChild(el);
  }
  const pt = document.getElementById("petals");
  for (let n = 0; n < 28; n++) {
    const el = document.createElement("span");
    el.className = "petal";
    el.style.setProperty("--x", rand(0, 100) + "%");
    el.style.setProperty("--w", rand(9, 18) + "px");
    el.style.setProperty("--t", rand(8, 15) + "s");
    el.style.setProperty("--delay", -rand(0, 12) + "s");
    el.style.setProperty("--sway", rand(-80, 80) + "px");
    pt.appendChild(el);
  }
})();

function showPickups() {
  const el = document.getElementById("pickup");
  let n = 0;
  (function next() {
    el.classList.remove("show");
    setTimeout(() => {

  })();

function paintSunflower() {
  const cv = document.getElementById("sunCanvas");
  const ctx = cv.getContext("2d");
  const k = cv.width / SUN.w;
  ctx.scale(k, k);
  ctx.lineJoin = "round";
  const queue = [];
  SUN.r.forEach(reg => reg.p.forEach(rings => queue.push([reg.c, rings])));
  let i = 0;
  const perFrame = Math.ceil(queue.length / 240);
  (function step() {
    for (let n = 0; n < perFrame && i < queue.length; n++, i++) {
      const [color, rings] = queue[i];
      ctx.beginPath();
      rings.forEach(r => {
        ctx.moveTo(r[0], r[1]);
        for (let j = 2; j < r.length; j += 2) ctx.lineTo(r[j], r[j + 1]);
        ctx.closePath();
      });
      ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 0.8;
      ctx.fill("evenodd"); ctx.stroke();
    }
    if (i < queue.length) requestAnimationFrame(step);
    else setTimeout(showPickups, 800);   // วาดเสร็จ -> เริ่มมุกจีบ
  })();
}

if (yesBtn && background && flowerContainer) {
  yesBtn.addEventListener("click", () => {
    background.classList.add("fade-out");
    flowerContainer.classList.add("visible");
    setTimeout(paintSunflower, 900);
  });
}
